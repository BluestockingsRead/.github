name: 🐛 Bug report
description: Report something that isn't working as expected
title: "[Bug] "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem!

        **Security issue?** Please do not include vulnerability details
        here. Follow the repository's security policy instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I searched the existing issues for the same problem.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem as clearly as you can.
      placeholder: Tell me what you saw and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the behavior you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        If possible, give the smallest set of steps that reproduces the
        problem.
      placeholder: |
        1. Go to...
        2. Enable/click/run...
        3. Do...
        4. See...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include whatever is relevant to this project.
      placeholder: |
        Project version or commit:
        Operating system:
        Browser or application:
        Extension/userscript manager:
        Other relevant versions or settings:
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Screenshots, logs, console errors, example URLs, or anything else
        that may help. Please remove sensitive or private information.
    validations:
      required: false